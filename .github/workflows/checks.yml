name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docs-and-sonos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host test prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libexpat1-dev
      - name: Check documentation
        run: python3 scripts/verify-bootstrap.py
      - name: Test production Sonos controller over localhost HTTP
        run: python3 scripts/test-sonos-protocol.py
